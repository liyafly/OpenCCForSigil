[project]
name = "opencc-for-sigil"
version = "0.1.0"
description = "A source-preserving official OpenCC Python Binding plugin for Sigil."
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "pytest==8.4.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["plugin/OpenCCForSigil"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [
    "plugin/OpenCCForSigil/vendor",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
