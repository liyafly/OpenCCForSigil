name: CI and Fat Plugin build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref_type == 'branch' }}

permissions:
  contents: read

jobs:
  build-payload:
    name: Verify ${{ matrix.id }} payload
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            runner: ubuntu-22.04
          - id: macos-arm64
            runner: macos-15
          - id: macos-x86_64
            runner: macos-15-intel
          - id: windows-x86_64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install mise toolchain
        uses: jdx/mise-action@v2

      - name: Install locked Python dependencies
        run: mise exec -- uv sync --locked

      - name: Check pinned OpenCC provenance before cache restore
        id: upstream
        run: mise exec -- uv run python tools/check_upstream_provenance.py

      - name: Restore target-tested payload cache
        id: payload-cache
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: native_build/artifacts/verified-payload
          key: opencc-payload-${{ matrix.id }}-${{ hashFiles('.github/workflows/ci.yml', 'native_build/payload-lock.json', 'tools/vendor_opencc.py', 'tools/build_opencc_jieba.py', 'tools/native_compatibility.py', 'tools/check_upstream_provenance.py', 'tools/export_verified_payload.py', 'tools/merge_verified_payloads.py', 'plugin/OpenCCForSigil/vendor/opencc/manifest.json') }}

      - name: Merge cached target-tested payload
        if: steps.payload-cache.outputs.cache-hit == 'true'
        run: mise exec -- uv run python tools/merge_verified_payloads.py --artifact-root native_build/artifacts/verified-payload

      - name: Check out pinned OpenCC source for the official Jieba plugin
        if: steps.payload-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: BYVoid/OpenCC
          ref: ${{ steps.upstream.outputs.commit }}
          path: native_build/OpenCC
          fetch-depth: 1

      - name: Vendor the exact official wheel for this runner
        if: steps.payload-cache.outputs.cache-hit != 'true'
        run: mise exec -- uv run python tools/vendor_opencc.py --version 1.4.2

      - name: Build and vendor the official native Jieba plugin
        if: steps.payload-cache.outputs.cache-hit != 'true'
        run: mise exec -- uv run python tools/build_opencc_jieba.py --source native_build/OpenCC

      - name: Inspect Linux native plugin linkage
        if: runner.os == 'Linux' && steps.payload-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          plugin="$(find plugin/OpenCCForSigil/vendor/opencc/payloads -name 'libopencc-jieba.so' -type f -print -quit)"
          test -n "$plugin"
          file "$plugin"
          ldd "$plugin"
          ldd -r "$plugin"
          nm -D --defined-only "$plugin" | grep opencc_get_segmentation_plugin_v2
          log_file="$RUNNER_TEMP/opencc-jieba-load.log"
          set +e
          LD_DEBUG=libs mise exec -- uv run python - <<'PY' >"$log_file" 2>&1
          import sys
          sys.path.insert(0, "plugin/OpenCCForSigil")
          from opencc_backend.runtime_selector import RuntimeSelector

          module, _, _, _, _ = RuntimeSelector().import_opencc()
          module.OpenCC("s2t_jieba").convert("汉字")
          PY
          status=$?
          grep -E 'libopencc-jieba|not found|cannot|error' "$log_file" | tail -120 || true
          if [ "$status" -ne 0 ]; then
            cat "$log_file"
            exit "$status"
          fi

      - name: Verify manifest and payload integrity
        run: mise exec -- uv run python tools/verify_vendor.py

      - name: Lint
        run: mise exec -- ruff check plugin tests tools

      - name: Test backend and plugin contracts
        run: mise exec -- uv run pytest

      - name: Run official CLI/Python Binding differential corpus
        run: mise exec -- uv run python tools/differential_test.py --corpus tests/fixtures/opencc_smoke.jsonl

      - name: Run official native Jieba CLI/Python Binding differential corpus
        run: mise exec -- uv run python tools/differential_jieba_test.py --corpus tests/fixtures/opencc_jieba_smoke.jsonl

      - name: Export the target-tested payload
        run: mise exec -- uv run python tools/export_verified_payload.py --output native_build/artifacts/verified-payload

      - name: Upload target-tested payload
        uses: actions/upload-artifact@v4
        with:
          name: opencc-payload-${{ matrix.id }}
          path: native_build/artifacts/verified-payload
          if-no-files-found: error
          retention-days: 14

  build-fat-plugin:
    name: Assemble and validate Fat Plugin
    needs: build-payload
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install mise toolchain
        uses: jdx/mise-action@v2

      - name: Install locked Python dependencies
        run: mise exec -- uv sync --locked

      - name: Download all target-tested payload artifacts
        uses: actions/download-artifact@v5
        with:
          path: native_build/artifacts

      - name: Merge target-tested payloads into the Fat Plugin tree
        run: mise exec -- uv run python tools/merge_verified_payloads.py --artifact-root native_build/artifacts --require-runtimes

      - name: Verify the merged manifest and every payload
        run: mise exec -- uv run python tools/verify_vendor.py --require-runtimes

      - name: Lint the assembled source once
        run: mise exec -- ruff check plugin tests tools

      - name: Run the Linux target differential corpus
        run: mise exec -- uv run python tools/differential_test.py --corpus tests/fixtures/opencc_smoke.jsonl

      - name: Run the Linux native Jieba differential corpus
        run: mise exec -- uv run python tools/differential_jieba_test.py --corpus tests/fixtures/opencc_jieba_smoke.jsonl

      - name: Run repository tests
        run: mise exec -- uv run pytest

      - name: Build and validate the Fat Plugin ZIP
        run: mise exec -- uv run python tools/build_plugin.py --require-runtimes --output dist/OpenCCForSigil_${{ github.sha }}.zip

      - name: Revalidate the exact final ZIP
        run: mise exec -- uv run python tools/validate_artifact.py --require-runtimes dist/OpenCCForSigil_${{ github.sha }}.zip

      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenCCForSigil-fat-plugin-${{ github.sha }}
          path: dist/OpenCCForSigil_${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish tagged GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-fat-plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Resolve release operations explicitly against this repository.
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Download the validated Fat Plugin artifact
        uses: actions/download-artifact@v5
        with:
          name: OpenCCForSigil-fat-plugin-${{ github.sha }}
          path: release-artifacts

      - name: Verify tag matches plugin metadata and prepare release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          version="${RELEASE_TAG#v}"
          plugin_zip="$(find release-artifacts -type f -name "OpenCCForSigil_${RELEASE_SHA}.zip" -print -quit)"
          test -n "$plugin_zip"
          test -f "$plugin_zip"
          python - "$plugin_zip" "$version" <<'PY'
          from pathlib import Path
          import sys
          import zipfile
          import xml.etree.ElementTree as ET

          archive_path = Path(sys.argv[1])
          expected = sys.argv[2]
          with zipfile.ZipFile(archive_path) as archive:
              metadata = ET.fromstring(archive.read("OpenCCForSigil/plugin.xml"))
          actual = metadata.findtext("version")
          if actual != expected:
              raise SystemExit(
                  f"release tag version {expected!r} does not match plugin.xml {actual!r}"
              )
          PY
          mv "$plugin_zip" "release-artifacts/OpenCCForSigil_${version}.zip"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          release_flags=(--latest)
          if [[ "$version" == *-* ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          notes_path="docs/releases/${RELEASE_TAG}.md"
          notes_flags=(--generate-notes)
          if [[ -f "$notes_path" ]]; then
            notes_flags=(--notes-file "$notes_path")
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "OpenCCForSigil ${RELEASE_TAG}" \
            "${release_flags[@]}" \
            "${notes_flags[@]}" \
            "release-artifacts/OpenCCForSigil_${version}.zip"
