name: CI and Fat Plugin build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-payload:
    name: Verify ${{ matrix.id }} payload
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            runner: ubuntu-latest
          - id: macos-arm64
            runner: macos-14
          - id: macos-x86_64
            runner: macos-13
          - id: windows-x86_64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install mise toolchain
        uses: jdx/mise-action@v2

      - name: Install locked Python dependencies
        run: mise exec -- uv sync --locked

      - name: Check out pinned OpenCC source for the official Jieba plugin
        uses: actions/checkout@v4
        with:
          repository: BYVoid/OpenCC
          ref: 025f371dc76b598d77384fbdab90c937471844d8
          path: native_build/OpenCC
          fetch-depth: 1

      - name: Vendor the exact official wheel for this runner
        run: mise exec -- uv run python tools/vendor_opencc.py --version 1.4.2

      - name: Build and vendor the official native Jieba plugin
        run: mise exec -- uv run python tools/build_opencc_jieba.py --source native_build/OpenCC

      - name: Inspect Linux native plugin linkage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          plugin="$(find plugin/OpenCCForSigil/vendor/opencc/payloads -name 'libopencc-jieba.so' -type f -print -quit)"
          test -n "$plugin"
          file "$plugin"
          ldd "$plugin"
          ldd -r "$plugin"
          nm -D --defined-only "$plugin" | grep opencc_get_segmentation_plugin_v2
          set +e
          LD_DEBUG=libs mise exec -- uv run python - <<'PY' 2>&1 | grep -E 'libopencc-jieba|not found|cannot|error' | tail -120
          import sys
          sys.path.insert(0, "plugin/OpenCCForSigil")
          from opencc_backend.runtime_selector import RuntimeSelector

          module, _, _, _, _ = RuntimeSelector().import_opencc()
          module.OpenCC("s2t_jieba").convert("汉字")
          PY
          exit 0

      - name: Verify manifest and payload integrity
        run: mise exec -- uv run python tools/verify_vendor.py

      - name: Lint
        run: mise exec -- ruff check plugin tests tools

      - name: Test backend and plugin contracts
        run: mise exec -- uv run pytest

      - name: Run official CLI/Python Binding differential corpus
        run: mise exec -- uv run python tools/differential_test.py --corpus tests/fixtures/opencc_smoke.jsonl

      - name: Run official native Jieba CLI/Python Binding differential corpus
        run: mise exec -- uv run python tools/differential_jieba_test.py --corpus tests/fixtures/opencc_jieba_smoke.jsonl

      - name: Export the target-tested payload
        run: mise exec -- uv run python tools/export_verified_payload.py --output native_build/artifacts/verified-payload

      - name: Upload target-tested payload
        uses: actions/upload-artifact@v4
        with:
          name: opencc-payload-${{ matrix.id }}
          path: native_build/artifacts/verified-payload
          if-no-files-found: error
          retention-days: 14

  build-fat-plugin:
    name: Assemble and validate Fat Plugin
    needs: build-payload
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install mise toolchain
        uses: jdx/mise-action@v2

      - name: Install locked Python dependencies
        run: mise exec -- uv sync --locked

      - name: Download all target-tested payload artifacts
        uses: actions/download-artifact@v5
        with:
          path: native_build/artifacts

      - name: Merge target-tested payloads into the Fat Plugin tree
        run: mise exec -- uv run python tools/merge_verified_payloads.py --artifact-root native_build/artifacts

      - name: Verify the merged manifest and every payload
        run: mise exec -- uv run python tools/verify_vendor.py

      - name: Run the Linux target differential corpus
        run: mise exec -- uv run python tools/differential_test.py --corpus tests/fixtures/opencc_smoke.jsonl

      - name: Run the Linux native Jieba differential corpus
        run: mise exec -- uv run python tools/differential_jieba_test.py --corpus tests/fixtures/opencc_jieba_smoke.jsonl

      - name: Run repository tests
        run: mise exec -- uv run pytest

      - name: Build and validate the Fat Plugin ZIP
        run: mise exec -- uv run python tools/build_plugin.py --output dist/OpenCCForSigil_${{ github.sha }}.zip

      - name: Build the specification bundle
        run: mise exec -- uv run python tools/build_spec_bundle.py

      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenCCForSigil-fat-plugin-${{ github.sha }}
          path: |
            dist/OpenCCForSigil_${{ github.sha }}.zip
            dist/OpenCCForSigil_Spec_v1.4_bundle.zip
          if-no-files-found: error
          retention-days: 14
